name: Refresh VirusTotal results

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/scripts/update-virustotal-results.mjs'
      - '.github/workflows/refresh-virustotal.yml'

permissions:
  contents: write

concurrency:
  group: virustotal-results
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Fetch VirusTotal reports
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: node .github/scripts/update-virustotal-results.mjs

      - name: Publish changed results
        shell: bash
        run: |
          if git diff --quiet -- virustotal-results.json; then
            echo "VirusTotal cache is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add virustotal-results.json
          git commit -m "Update VirusTotal results"
          git push

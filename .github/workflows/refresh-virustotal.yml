name: Refresh VirusTotal results

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/scripts/update-virustotal-results.mjs'
      - '.github/workflows/refresh-virustotal.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: virustotal-results
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Fetch VirusTotal reports
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: node .github/scripts/update-virustotal-results.mjs

      - name: Publish changed results
        id: publish
        shell: bash
        run: |
          if git diff --quiet -- virustotal-results.json; then
            echo "VirusTotal cache is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add virustotal-results.json
          git commit -m "Update VirusTotal results"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          status=$(curl --silent --show-error \
            --output pages-build-response.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")

          if [ "$status" != "201" ] && [ "$status" != "409" ]; then
            cat pages-build-response.json
            exit 1
          fi
